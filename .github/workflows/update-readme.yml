name: Atualizar Top Repos

on:
  workflow_dispatch:    # Permite rodar manualmente pela aba Actions
  schedule:
    - cron: '0 0 * * 0' # opcional: roda semanalmente aos domingos (UTC)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Gerar Top Repos
        env:
          GITHUB_USERNAME: alekus2
          TOP_N: 6
          SORT_BY: stargazers_count   # ou pushed_at
        run: |
          node scripts/update_readme.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualizar top repos" || echo "Sem alterações"
          git push